# Munin configuration file
# See https://munin.readthedocs.io/ for full reference

# Where to store RRD files and HTML output
dbdir   /var/lib/munin
htmldir /var/lib/munin/html
logdir  /var/log/munin
rundir  /var/run/munin

# Where to look for plugins
tmpldir /etc/munin/templates

# HTML page title
# html_title My Monitoring Server

# Maximum number of concurrent processes
max_processes 16

# Host definitions (localhost monitoring)
[localhost]
    address 127.0.0.1
    use_node_name yes

# Example remote host (uncomment and modify)
# [remote-server]
#     address 192.168.1.100
#     use_node_name yes

# Plugin configuration examples
# [cpu]
#     env.scale no
#
# [df]
#     env.warning 80
#     env.critical 90
