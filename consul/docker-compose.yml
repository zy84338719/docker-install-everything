version: '3'
services:
  consul:
    image: consul:${CONSUL_VERSION}
    container_name: consul
    ports:
      - '8500:8500'
      - '8600:8600/udp'
      - '8300:8300'
      - '8301:8301'
      - '8302:8302'
    command: agent -server -bootstrap -ui -client=0.0.0.0
    volumes:
      - './data/consul:/consul/data'
