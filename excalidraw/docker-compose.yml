version: '3'
services:
  excalidraw:
    # excalidraw 官方镜像仅提供 latest / commit-sha tag，无语义化版本
    image: 'excalidraw/excalidraw:${EXCALIDRAW_VERSION}'
    container_name: excalidraw
#    restart: always
    ports:
      - '5000:80'
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - './data/web:/app/web'
