version: '3'
services:
  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_VERSION}
    container_name: mosquitto
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - './conf/mosquitto.conf:/mosquitto/config/mosquitto.conf'
      - './data/mosquitto:/mosquitto/data'
      - './log/mosquitto:/mosquitto/log'
