# dnsmasq configuration file
# See https://thekelleys.org.uk/dnsmasq/docs/dnsmasq-man.html for full reference

# Listen on all interfaces
listen-address=0.0.0.0

# Do not read /etc/resolv.conf or /etc/hosts from the container
no-resolv
no-hosts

# Upstream DNS servers (Google DNS and Cloudflare DNS)
server=8.8.8.8
server=8.8.4.4
server=1.1.1.1

# Local DNS entries (example - modify as needed)
# address=/home.lan/192.168.1.1
# address=/nas.lan/192.168.1.100
# address=/server.lan/192.168.1.50

# DHCP range (uncomment to enable DHCP)
# dhcp-range=192.168.1.100,192.168.1.200,255.255.255.0,24h
# dhcp-option=option:router,192.168.1.1
# dhcp-option=option:dns-server,192.168.1.1

# Log queries (useful for debugging)
# log-queries
# log-facility=/var/log/dnsmasq.log

# Cache size (number of entries)
cache-size=1000

# Block advertisements (example entries)
# address=/ads.example.com/
# address=/tracking.example.com/
