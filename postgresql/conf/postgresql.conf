# PostgreSQL Configuration
# 监听所有地址 / Listen on all addresses
listen_addresses = '*'

# 最大连接数 / Maximum connections
max_connections = 100

# 共享缓冲区 / Shared buffers
shared_buffers = 256MB

# 日志设置 / Logging
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'all'

# 连接设置 / Connection settings
port = 5432
