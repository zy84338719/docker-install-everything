version: '3'
services:
  jira-mysql:
    image: mysql:${MYSQL_VERSION}
    container_name: jira-mysql
    command: --mysql-native-password=ON
    environment:
      - MYSQL_ROOT_PASSWORD=${ROOT_PASSWORD}
      - MYSQL_DATABASE=jiradb
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - TZ=${MYSQL_TIMEZONE}
    networks:
      - net-jira
    volumes:
      - ./conf/mysql/my.cnf:/etc/mysql/conf.d/mysqld_jira.cnf
      - ./data/mysql:/var/lib/mysql
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  jira:
    # atlassian/jira-software 仅提供 latest 滚动 tag，无语义化版本
    # 默认 JIRA_VERSION=latest；如需固定，在 .env 设置为 docker hub 上的具体 tag
    image: atlassian/jira-software:${JIRA_VERSION}
    container_name: jira
    hostname: jira
    depends_on:
      - jira-mysql
    ports:
      - "${WEB_PORT}:8080"
    networks:
      - net-jira
    volumes:
      - ./conf/mysql-connector-java-5.1.48.jar:/opt/atlassian/jira/lib/mysql-connector-java-5.1.48.jar
      - ./data/jira:/var/atlassian/application-data/jira
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

networks:
  net-jira:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${DOCKER_SUBNET}