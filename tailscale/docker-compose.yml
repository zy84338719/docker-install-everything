version: '3'

# Tailscale - WireGuard mesh VPN
# 用作子网路由器, 连接不同局域网 (如 Studio 10.10.30.0/24 <-> Dev 10.10.21.0/24)
#
# 部署步骤:
#   1. cp .env.example .env && vi .env
#   2. docker-compose up -d
#   3. 在 Tailscale Admin Console 批准子网路由

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    hostname: ${TS_HOSTNAME}
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale-state:/var/lib/tailscale
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME}
      - TS_ACCEPT_ROUTES=true
      - TS_ROUTES=${TS_ROUTES}
      - TS_MTU=${TS_MTU:-1420}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:-}
      - TZ=Asia/Shanghai
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tailscale-state:
