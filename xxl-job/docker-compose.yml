version: '3'
services:
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:${XXL_JOB_VERSION}
    container_name: xxl-job-admin
    ports:
      - '8080:8080'
    environment:
      - PARAMS=--spring.datasource.url=jdbc:mysql://xxl-job-db:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true --spring.datasource.username=${MYSQL_USER} --spring.datasource.password=${MYSQL_PASSWORD}
    volumes:
      - './data/xxl-job:/data/applogs'
    depends_on:
      - xxl-job-db
  xxl-job-db:
    image: mysql:${MYSQL_VERSION}
    container_name: xxl-job-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=xxl_job
    volumes:
      - './data/mysql:/var/lib/mysql'
