version: '3'
services:
  nginx:
    image: nginx:${NGINX_VERSION}
    container_name: nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - './conf/nginx.conf:/etc/nginx/nginx.conf:ro'
      - './conf/conf.d:/etc/nginx/conf.d:ro'
      - './html:/usr/share/nginx/html'
      - './logs:/var/log/nginx'
