version: '3'

services:
  caddy:
    image: caddy:${CADDY_VERSION}
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./conf/Caddyfile:/etc/caddy/Caddyfile
      - ./data:/data
      - ./config:/config
      - ./log:/var/log/caddy
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
